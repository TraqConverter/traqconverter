name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: traqconverter
          POSTGRES_PASSWORD: traqconverter
          POSTGRES_DB: traqconverter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traqconverter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      database_url: postgresql+psycopg2://traqconverter:traqconverter@localhost:5432/traqconverter_test
      DATABASE_URL: postgresql+psycopg2://traqconverter:traqconverter@localhost:5432/traqconverter_test
      app_name: TraqConverter
      environment: test
      secret_key: ci-secret-key-0123456789abcdef0123456789abcdef0123456789abcdef
      algorithm: HS256
      access_token_expire_minutes: "60"
      CORS_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: sk-test
      ANTHROPIC_API_KEY: sk-ant-test
      stripe_secret_key: sk_test_ci
      stripe_publishable_key: pk_test_ci
      stripe_webhook_secret: whsec_ci
      STRIPE_PRICE_PRO: price_ci_pro
      STRIPE_PRICE_BASIC: price_ci_basic
      STRIPE_PRICE_CREDITS_10: price_ci_10
      STRIPE_PRICE_CREDITS_25: price_ci_25
      STRIPE_PRICE_CREDITS_50: price_ci_50
      SUPABASE_S3_ENDPOINT: ""
      SUPABASE_S3_ACCESS_KEY: ci
      SUPABASE_S3_SECRET_KEY: ci
      SUPABASE_S3_REGION: us-east-1
      S3_BUCKET_NAME: ci-bucket
      RUN_WORKER_INLINE: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      # Syntax errors, broken comparisons and undefined names; widen as the baseline is cleaned.
      - name: Ruff
        run: ruff check --select E9,F63,F7,F82 backend --exclude backend/venv

      - name: Migrate
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Smoke import
        working-directory: backend
        run: python -c "import app.main"

      - name: Tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traqconverter-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: traqconverter-frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
